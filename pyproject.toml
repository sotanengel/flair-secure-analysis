[project]
name = "flair-secure-analysis"
version = "0.1.0"
description = "FLAIR ベースのセキュア分析コンテナ環境 (Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "flaircast>=0.2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "flask>=3.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true
